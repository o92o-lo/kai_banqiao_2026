<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kai · 板橋 2026｜網站即將上線</title>
  <meta name="description" content="Kai · 板橋 2026 — 網站即將上線 / Coming soon">
  <meta property="og:title" content="Kai · 板橋 2026">
  <meta property="og:description" content="網站即將上線 / Coming soon">

  <!--
    LATER: to send visitors (and every printed QR code) somewhere else,
    uncomment the line below and replace the URL. Nothing else needs to change.
  -->
  <!-- <meta http-equiv="refresh" content="0; url=https://example.com/"> -->

  <style>
    :root {
      --bg: #f7f5f0;
      --ink: #1d2433;
      --muted: #5c6475;
      --accent: #c8102e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171f; --ink: #f1f2f5; --muted: #a3a9b6; --accent: #ff5a6e; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { max-width: 560px; }
    .tag {
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      padding: 4px 14px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(2.6rem, 11vw, 4.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    h1 span { color: var(--accent); }
    .rule {
      width: 56px; height: 4px;
      background: var(--accent);
      border-radius: 2px;
      margin: 28px auto;
    }
    p.zh { font-size: 1.35rem; font-weight: 600; }
    p.en { margin-top: 6px; color: var(--muted); font-size: 1rem; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <main>
    <div class="tag">2026</div>
    <h1>Kai<br><span>板橋</span></h1>
    <div class="rule"></div>
    <p class="zh">網站即將上線，敬請期待</p>
    <p class="en">Coming soon</p>
  </main>
</body>
</html>
